name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
    
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
    
      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: ./nuestra_historia
    
      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: ./nuestra_historia

      - name: Move build to repo root explicitly
        run: |
          rm -rf $GITHUB_WORKSPACE/deploy
          mkdir $GITHUB_WORKSPACE/deploy
          cp -r $GITHUB_WORKSPACE/nuestra_historia/build/web/* $GITHUB_WORKSPACE/deploy/

      - name: Verify deploy folder
        run: ls -R deploy

      - name: Verify build output
        run: ls -R nuestra_historia/build/web
    
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GLACIER_0022A6D10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "deploy"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_GLACIER_0022A6D10 }}
          action: "close"









